<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR Review Cockpit</title>
    <script>
      // Mirrors lib/theme.ts, and runs before the stylesheet so the first paint
      // is already in the stored theme. Repainting a whole diff from white to
      // dark is worth these few duplicated lines.
      try {
        var stored = localStorage.getItem('review-cockpit:theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
